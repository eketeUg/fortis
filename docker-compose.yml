services:
  # 🏋️ FORTIS FIT Application Container
  fortis-fit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fortis-fit
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3005
      - TZ=Africa/Lagos
    ports:
      # Binds to localhost only on your VPS
      # Your host Nginx proxies public HTTPS traffic to this port
      - "127.0.0.1:3005:3005"
    volumes:
      - fortis-data:/app/.data
      - ./public/assets/exercises:/app/public/assets/exercises

volumes:
  fortis-data:
